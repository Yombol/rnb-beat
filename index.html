    <style>
        :root {
            /* Paleta Rose Neon (sin amarillo pálido) */
            --neon-pink: #FF007F;
            --rose-barbie: #FF1493;
            --rose-diamond: #FF8DA1;
            --soft-pink: #FFB6C1;
            --bg-dark-magenta: #0F020A;
            --glass-bg: rgba(28, 5, 20, 0.85);
            --glass-hover: rgba(50, 10, 36, 0.95);
            --text-light: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark-magenta);
            color: var(--text-light);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- FONDO CON ORBES NEÓN --- */
        .bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 30%, #210416 0%, var(--bg-dark-magenta) 100%);
            overflow: hidden;
        }

        .neon-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            animation: moveNeon 16s infinite alternate ease-in-out;
        }

        .orb-1 { width: 450px; height: 450px; background: var(--neon-pink); top: -5%; left: -5%; }
        .orb-2 { width: 500px; height: 500px; background: var(--rose-barbie); bottom: -10%; right: -5%; animation-delay: -5s; }
        .orb-3 { width: 380px; height: 380px; background: var(--rose-diamond); top: 40%; left: 30%; opacity: 0.25; animation-delay: -10s; }

        @keyframes moveNeon {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.25) translate(40px, -40px); }
        }

        /* --- ELEMENTOS FLOTANTES --- */
        .floating-emoji {
            position: absolute;
            font-size: 3rem;
            opacity: 0.35;
            filter: drop-shadow(0 0 15px var(--neon-pink));
            user-select: none;
            transition: transform 0.2s ease-out;
        }

        .emoji-1  { top: 5%;   left: 3%;  animation: float1 20s infinite alternate ease-in-out; font-size: 3.5rem; }
        .emoji-2  { top: 22%;  left: 5%;  animation: float2 24s infinite alternate ease-in-out; animation-delay: -3s; }
        .emoji-3  { top: 45%;  left: 2%;  animation: float1 18s infinite alternate ease-in-out; animation-delay: -6s; font-size: 3.8rem; }
        .emoji-4  { top: 68%;  left: 4%;  animation: float2 22s infinite alternate ease-in-out; animation-delay: -9s; }

        .emoji-7  { top: 28%;  right: 2%; animation: float1 23s infinite alternate ease-in-out; animation-delay: -4s; }

        @keyframes float1 {

            50%  { transform: translateY(-30px) translateX(15px) rotate(15deg) scale(1.1); }
            100% { transform: translateY(20px) translateX(-10px) rotate(-10deg) scale(0.95); }
        }

        @keyframes float2 {
            0%   { transform: translateY(0px) rotate(0deg) scale(1); }
            50%  { transform: translateY(30px) translateX(-15px) rotate(-15deg) scale(1.1); }
            100% { transform: translateY(-20px) translateX(10px) rotate(10deg) scale(0.95); }
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; position: relative; z-index: 1; }
        
        section { padding: 40px 0; }

        /* --- BANNER --- */
        .banner-wrapper {
            width: 100%;
            margin: 20px auto; 
            border-radius: 12px;
            padding: 3px;
            background: linear-gradient(45deg, var(--neon-pink), var(--rose-diamond), var(--rose-barbie));
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.6), 0 0 20px rgba(255, 141, 161, 0.4);
        }

        .banner {
            border-radius: 9px;
            overflow: hidden;
            line-height: 0;
            background: #000;
        }

        .banner img { width: 100%; height: auto; display: block; object-fit: cover; }

        /* --- REPRODUCTOR --- */
        .player-wrapper {

            box-shadow: 0 0 50px rgba(255, 20, 147, 0.5), 0 0 25px rgba(255, 0, 127, 0.4);
        }

        .player-container {
            background: #000;
            border-radius: 9px;
            overflow: hidden;
            line-height: 0;
        }

        .player-container iframe { display: block; border: none; width: 100%; height: 800px; }

        /* --- TITULOS --- */
        .section-title {
            text-align: center; 
            margin-bottom: 40px; 
            font-size: 2.8rem; 
            font-weight: 900;
            text-transform: uppercase; 
            letter-spacing: 4px; 
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 25px var(--rose-barbie), 0 0 45px var(--neon-pink); 
        }

        /* --- TABLA DE LICENCIAS --- */
        .pricing-table { display: flex; flex-direction: column; gap: 18px; }

        .price-row {
            background: var(--glass-bg); 
            padding: 30px 40px; 
            display: grid; 
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center; 
            transition: 0.4s; 
            border-radius: 12px;
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 20, 147, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .price-row::before {
            content: "";
            position: absolute;
            left: 0; top: 0; width: 6px; height: 100%;
            transition: 0.4s;
        }

        .price-row:nth-child(1)::before { background: var(--rose-diamond); box-shadow: 0 0 15px var(--rose-diamond); }
        .price-row:nth-child(2)::before { background: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }
        .price-row:nth-child(3)::before { background: var(--soft-pink); box-shadow: 0 0 15px var(--soft-pink); }
        .price-row:nth-child(4)::before { background: #ffffff; box-shadow: 0 0 15px #ffffff; }

        .price-row:hover {
            transform: translateX(10px) scale(1.01);
            background: var(--glass-hover);
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.4);
            border-color: rgba(255, 141, 161, 0.6);
        }

        .price-row:hover::before { width: 10px; }

        .price-row:nth-child(3) .license-name { color: var(--soft-pink); text-shadow: 0 0 10px rgba(255, 182, 193, 0.5); }
        .price-row:nth-child(4) .license-name { color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }
